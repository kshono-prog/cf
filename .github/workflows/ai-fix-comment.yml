name: AI Fix Comment

on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  comment:
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest

    steps:
      - name: Download Playwright failure summary
        uses: actions/download-artifact@v4
        with:
          name: playwright-failure-summary
          path: artifacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}

      - name: Create or update PR failure comment
        uses: actions/github-script@v7
        env:
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_RUN_URL: ${{ github.event.workflow_run.html_url }}
        with:
          script: |
            const fs = require("fs");

            const workflowRun = context.payload.workflow_run;
            const pr = workflowRun.pull_requests[0];
            const marker = "<!-- ai-fix-comment -->";

            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRun,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: workflowRun.id,
                per_page: 100,
              }
            );

            const failedJobs = jobs
              .filter((job) => job.conclusion === "failure")
              .map((job) => job.name);

            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: workflowRun.id,
                per_page: 100,
              }
            );

            let failureSummary = {
              failedJob: null,
              failedSpecs: [],
              artifactPaths: [],
              rerunGuidance:
                "Open the Playwright HTML report first, then inspect trace, screenshot, and video for the failing spec.",
            };

            const summaryPath = "artifacts/failure-summary.json";
            if (fs.existsSync(summaryPath)) {
              failureSummary = {
                ...failureSummary,
                ...JSON.parse(fs.readFileSync(summaryPath, "utf8")),
              };
            }

            const failedJobLines =
              failedJobs.length > 0
                ? failedJobs.map((job) => `- ${job}`).join("\n")
                : "- No failed job details were available.";

            const failedSpecLines =
              failureSummary.failedSpecs.length > 0
                ? failureSummary.failedSpecs.map((spec) => `- ${spec}`).join("\n")
                : "- No failing Playwright spec file was detected.";

            const artifactLines =
              artifacts.length > 0
                ? artifacts.map((artifact) => `- ${artifact.name}`).join("\n")
                : "- No artifacts were uploaded.";

            const artifactPathLines =
              failureSummary.artifactPaths.length > 0
                ? failureSummary.artifactPaths.map((path) => `- ${path}`).join("\n")
                : "- Artifact paths were not recorded.";

            const body = `${marker}
            ## Test failure summary

            Workflow run: ${process.env.WORKFLOW_RUN_URL}

            Failed jobs
            ${failedJobLines}

            Failed spec files
            ${failedSpecLines}

            Artifact names
            ${artifactLines}

            Artifact paths
            ${artifactPathLines}

            Rerun guidance
            ${failureSummary.rerunGuidance}
            `;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                per_page: 100,
              }
            );

            const existing = comments.find((comment) =>
              comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body,
            });
