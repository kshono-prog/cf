name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Lint
        run: npm run lint

      - name: Unit tests with coverage
        run: npm run test:unit -- --coverage

      - name: Playwright E2E
        id: e2e
        continue-on-error: true
        run: |
          mkdir -p test-results
          set -o pipefail
          npm run test:e2e 2>&1 | tee test-results/playwright-output.log

      - name: Build Playwright failure summary
        if: always()
        env:
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          const outputPath = "test-results/playwright-output.log";
          const output = fs.existsSync(outputPath)
            ? fs.readFileSync(outputPath, "utf8")
            : "";

          const failedSpecs = Array.from(
            new Set(
              output
                .split(/\r?\n/)
                .map((line) => line.match(/›\s+(tests\/e2e\/[^\s:]+\.ts)/)?.[1] ?? null)
                .filter(Boolean)
            )
          );

          const summary = {
            failedJob: process.env.E2E_OUTCOME === "failure" ? "e2e" : null,
            failedSpecs,
            artifactPaths: ["playwright-report/", "test-results/", "coverage/"],
            rerunGuidance:
              "Open the Playwright HTML report first, then inspect trace, screenshot, and video for the failing spec.",
          };

          fs.mkdirSync("test-results", { recursive: true });
          fs.writeFileSync(
            "test-results/failure-summary.json",
            JSON.stringify(summary, null, 2)
          );
          NODE

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

      - name: Upload Playwright failure summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-summary
          path: test-results/failure-summary.json
          if-no-files-found: ignore

      - name: Fail if Playwright failed
        if: steps.e2e.outcome == 'failure'
        run: exit 1
